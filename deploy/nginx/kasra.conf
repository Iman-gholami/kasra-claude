# ─────────────────────────────────────────────────────────────────────────────
# Kasra Boutique — Nginx reverse proxy (host-level Nginx on Ubuntu LTS).
#
# Install:  sudo cp deploy/nginx/kasra.conf /etc/nginx/sites-available/kasra.conf
#           sudo ln -s ../sites-available/kasra.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Replace `kasra.example` with the real domain. TLS certificates are issued by
# certbot (see docs/deployment.md). Traffic flow:
#   ParsPack CDN/WAF → this Nginx (TLS, caching of immutable assets, rate
#   limits) → two Next.js containers on 127.0.0.1:3001/3002.
# ─────────────────────────────────────────────────────────────────────────────

upstream kasra_web {
    least_conn;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Optimized images are negotiated by the Accept header (AVIF/WebP), so the
# cache key must include the chosen format.
map $http_accept $kasra_img_format {
    default        "orig";
    "~image/avif"  "avif";
    "~image/webp"  "webp";
}

# Real client IP when requests arrive through the CDN. Replace with the CDN's
# published egress ranges before enabling (never trust X-Forwarded-For from
# arbitrary sources):
# set_real_ip_from 0.0.0.0/0;   # ← placeholder, do NOT use as-is
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

limit_req_zone  $binary_remote_addr zone=kasra_api:10m  rate=10r/s;
limit_req_zone  $binary_remote_addr zone=kasra_page:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=kasra_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# Disk cache for optimized product images (bounded size; LRU eviction).
proxy_cache_path /var/cache/nginx/kasra_img levels=1:2 keys_zone=kasra_img:20m
                 max_size=5g inactive=30d use_temp_path=off;

log_format kasra_main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" rt=$request_time '
                      'urt=$upstream_response_time ucs=$upstream_cache_status';

# ── HTTP: ACME challenges + redirect to HTTPS ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name kasra.example www.kasra.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kasra.example$request_uri;
    }
}

# ── HTTPS: www → apex ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kasra.example;

    ssl_certificate     /etc/letsencrypt/live/kasra.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasra.example/privkey.pem;

    return 301 https://kasra.example$request_uri;
}

# ── HTTPS: application ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kasra.example;

    ssl_certificate     /etc/letsencrypt/live/kasra.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kasra.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kasra_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/kasra.access.log kasra_main;
    error_log  /var/log/nginx/kasra.error.log warn;

    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn kasra_conn 50;

    # Security headers (the app sets nosniff/referrer/frame/permissions too).
    # Enable HSTS only after HTTPS is confirmed working on every subdomain:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/xml
               application/manifest+json image/svg+xml text/x-component;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;

    # Never serve dotfiles.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Content-hashed build assets: cache forever (browser + CDN).
    location /_next/static/ {
        proxy_pass http://kasra_web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Optimized images: cached on disk here and at the CDN.
    location /_next/image {
        proxy_pass http://kasra_web;
        proxy_cache kasra_img;
        proxy_cache_key "$host$request_uri|$kasra_img_format";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 400 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Vary "Accept" always;
        access_log off;
    }

    # Source images, fonts and icons (Cache-Control comes from the app).
    location ~* ^/(images/|og-image\.jpg|icon\.svg|apple-icon\.png|manifest\.webmanifest) {
        proxy_pass http://kasra_web;
        access_log off;
    }

    location = /api/health {
        proxy_pass http://kasra_web;
        access_log off;
    }

    location /api/ {
        limit_req zone=kasra_api burst=30 nodelay;
        proxy_pass http://kasra_web;
    }

    # Pages and RSC payloads. Buffering is disabled so Partial Prerendering can
    # stream the static shell first and dynamic sections as they finish.
    location / {
        limit_req zone=kasra_page burst=60 nodelay;
        proxy_buffering off;
        proxy_pass http://kasra_web;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/kasra-errors;
        internal;
    }
}
