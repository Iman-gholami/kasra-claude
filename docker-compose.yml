# Kasra Boutique — production Compose file for the current frontend-only phase.
#
# Two identical Next.js containers sit behind the host's Nginx (see
# deploy/nginx/kasra.conf). Two replicas let a deploy restart one container at
# a time without downtime and use more than one CPU core; both bind to
# localhost only, so the app is never exposed directly to the internet.
#
#   docker compose build            # build the image (tag from KASRA_TAG)
#   docker compose up -d            # start / update
#   docker compose ps               # health status
#
# Resource budget on the 8 vCPU / 16 GB server: see docs/deployment.md.

name: kasra

x-web: &web
  image: kasra-frontend:${KASRA_TAG:-latest}
  build:
    context: .
    args:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ALLOW_INDEXING: ${NEXT_PUBLIC_ALLOW_INDEXING:-false}
      APP_VERSION: ${KASRA_TAG:-latest}
  env_file:
    - path: .env.production
      required: false
  environment:
    NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1024}
  restart: unless-stopped        # comes back after crashes and server reboots
  init: true                     # signal forwarding even if the entrypoint changes
  stop_grace_period: 30s         # let in-flight requests finish on SIGTERM
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1536M
      reservations:
        cpus: "0.5"
        memory: 512M
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 30s
    timeout: 5s
    start_period: 20s
    retries: 3

services:
  web-1:
    <<: *web
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - web-1-cache:/app/.next/cache

  web-2:
    <<: *web
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - web-2-cache:/app/.next/cache

volumes:
  # Optimized-image and data caches survive container restarts but are
  # disposable: deleting them only costs re-optimization work.
  web-1-cache:
  web-2-cache:
