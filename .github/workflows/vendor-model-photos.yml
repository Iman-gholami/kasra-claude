name: Vendor model preview photos

on:
  push:
    branches:
      - preview/model-photography

permissions:
  contents: write

jobs:
  vendor:
    if: github.repository == 'Iman-gholami/kasra-claude'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/model-photography
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Download and verify model photographs
        run: node scripts/vendor-model-photos.mjs
      - name: Commit downloaded photos to the preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/model-preview/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: vendor stock model photos for offline preview [skip ci]'
            git push origin HEAD:preview/model-photography
          fi
